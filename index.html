<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Pulse Rhythm</title>
  <style>
    :root {
      --red: #ff3b5f;
      --cyan: #23e7ff;
      --yellow: #ffe64d;
      --green: #4dff88;
      --bg: #070812;
      --panel: rgba(15, 18, 38, 0.78);
      --hit-y: 82%;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 18%, #1d2153 0%, #090a18 42%, #02030a 100%);
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle, black 20%, transparent 76%);
    }

    #gameWrap {
      position: relative;
      width: min(920px, 100vw);
      height: 100vh;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    canvas {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      display: block;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 24px;
      background: rgba(4, 5, 14, 0.72);
      box-shadow:
        0 0 32px rgba(35, 231, 255, 0.16),
        0 0 80px rgba(255, 59, 95, 0.08),
        inset 0 0 42px rgba(255, 255, 255, 0.04);
    }

    .hud {
      position: absolute;
      top: 30px;
      left: 32px;
      right: 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
    }

    .statPanel {
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 18px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 26px rgba(0, 0, 0, 0.28);
      min-width: 170px;
    }

    .label {
      color: rgba(255, 255, 255, 0.63);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    #score {
      font-size: clamp(28px, 5vw, 46px);
      font-weight: 900;
      line-height: 1;
    }

    #combo {
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 900;
      line-height: 1.08;
      color: #fff;
    }

    #multiplier {
      margin-top: 3px;
      color: #23e7ff;
      font-size: 14px;
      font-weight: 800;
    }

    #judge {
      position: absolute;
      left: 50%;
      top: 39%;
      transform: translate(-50%, -50%) scale(1);
      min-width: 260px;
      text-align: center;
      font-size: clamp(36px, 7vw, 76px);
      font-weight: 1000;
      letter-spacing: 0.05em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease, transform 120ms ease;
      text-shadow: 0 0 18px currentColor, 0 0 42px currentColor;
    }

    #judge.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.08);
    }

    #countdown {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      font-size: clamp(72px, 19vw, 190px);
      font-weight: 1000;
      color: #fff;
      text-shadow: 0 0 26px #23e7ff, 0 0 70px #ff3b5f;
      opacity: 0;
    }

    #overlay {
      position: absolute;
      inset: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 28px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 35%, rgba(35, 231, 255, 0.16), transparent 36%),
        rgba(3, 4, 12, 0.78);
      text-align: center;
      pointer-events: none;
      transition: opacity 900ms ease;
    }

    #overlay.fade {
      opacity: 0;
    }

    #overlay h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 86px);
      line-height: 0.92;
      letter-spacing: -0.06em;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(35, 231, 255, 0.7), 0 0 52px rgba(255, 59, 95, 0.42);
    }

    #overlay p {
      max-width: 640px;
      margin: 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: clamp(16px, 2.4vw, 22px);
      line-height: 1.45;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 62px);
      gap: 12px;
      margin-top: 6px;
    }

    .key {
      height: 62px;
      display: grid;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 16px;
      font-size: 26px;
      font-weight: 1000;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 18px currentColor, inset 0 0 14px rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 620px) {
      #gameWrap {
        padding: 8px;
      }

      .hud {
        top: 18px;
        left: 18px;
        right: 18px;
      }

      .statPanel {
        min-width: 100px;
        padding: 8px 10px;
      }

      .keys {
        grid-template-columns: repeat(4, 42px);
        gap: 8px;
      }

      .key {
        width: 42px;
        height: 42px;
        font-size: 20px;
      }

      #touchControls {
        display: flex !important;
      }
    }

    @media (pointer: coarse) {
      #touchControls {
        display: flex !important;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      /* Mobile-first: hide desktop key hints in overlay */
      .keys {
        display: none;
      }
      #overlay p {
        max-width: 500px;
        font-size: clamp(14px, 3vw, 18px);
      }
    }

    /* Touch control buttons overlaid below the hit zone */
    #touchControls {
      display: none;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 22vh;
      z-index: 10;
      pointer-events: none;
    }

    .touchLane {
      position: absolute;
      bottom: 10px;
      top: 4px;
      border-radius: 16px 16px 0 0;
      border: 2px solid transparent;
      transition: background 0.08s, border-color 0.08s;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    .touchLane.active {
      background: var(--lane-color) !important;
      border-color: white;
      opacity: 0.6 !important;
    }

    .touchLane:nth-child(1) { left: calc(9% + 0 * 21%); width: 20%; }
    .touchLane:nth-child(2) { left: calc(9% + 1 * 21%); width: 20%; }
    .touchLane:nth-child(3) { left: calc(9% + 2 * 21%); width: 20%; }
    .touchLane:nth-child(4) { left: calc(9% + 3 * 21%); width: 20%; }

    @media (min-width: 700px) {
      .touchLane:nth-child(1) { left: calc(10% + 0 * 20%); width: 19%; }
      .touchLane:nth-child(2) { left: calc(10% + 1 * 20%); width: 19%; }
      .touchLane:nth-child(3) { left: calc(10% + 2 * 20%); width: 19%; }
      .touchLane:nth-child(4) { left: calc(10% + 3 * 20%); width: 19%; }
    }
  </style>
</head>
<body>
  <div id="gameWrap">
    <canvas id="game"></canvas>

    <div class="hud">
      <div class="statPanel">
        <div class="label">Score</div>
        <div id="score">0</div>
      </div>
      <div class="statPanel" style="text-align: right;">
        <div class="label">Combo</div>
        <div id="combo">0</div>
        <div id="multiplier">x1.0 multiplier</div>
      </div>
    </div>

    <div id="judge"></div>
    <div id="countdown"></div>

    <div id="overlay">
      <h1>Neon Pulse</h1>
      <p>Tap the lanes or press <strong>D</strong>, <strong>F</strong>, <strong>J</strong>, <strong>K</strong>. Perfect ±50ms, Great ±100ms, Good ±150ms.</p>
      <div class="keys">
        <div class="key" style="color: var(--red);">D</div>
        <div class="key" style="color: var(--cyan);">F</div>
        <div class="key" style="color: var(--yellow);">J</div>
        <div class="key" style="color: var(--green);">K</div>
      </div>
    </div>
  </div>

  <!-- Touch controls overlay (hidden on desktop) -->
  <div id="touchControls">
    <div class="touchLane" data-lane="0" style="--lane-color: var(--red);"></div>
    <div class="touchLane" data-lane="1" style="--lane-color: var(--cyan);"></div>
    <div class="touchLane" data-lane="2" style="--lane-color: var(--yellow);"></div>
    <div class="touchLane" data-lane="3" style="--lane-color: var(--green);"></div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const comboEl = document.getElementById('combo');
      const multiplierEl = document.getElementById('multiplier');
      const judgeEl = document.getElementById('judge');
      const countdownEl = document.getElementById('countdown');
      const overlayEl = document.getElementById('overlay');

      const lanes = [
        { key: 'd', label: 'D', color: '#ff3b5f', glow: 'rgba(255, 59, 95, ' },
        { key: 'f', label: 'F', color: '#23e7ff', glow: 'rgba(35, 231, 255, ' },
        { key: 'j', label: 'J', color: '#ffe64d', glow: 'rgba(255, 230, 77, ' },
        { key: 'k', label: 'K', color: '#4dff88', glow: 'rgba(77, 255, 136, ' }
      ];

      const keyToLane = { d: 0, f: 1, j: 2, k: 3 };
      const countdownSeconds = 2;
      const travelTime = 1.75;
      const songLength = 30;
      const hitWindows = [
        { name: 'PERFECT', limit: 0.05, points: 300, color: '#ffd86b' },
        { name: 'GREAT', limit: 0.10, points: 200, color: '#4dff88' },
        { name: 'GOOD', limit: 0.15, points: 100, color: '#42a5ff' }
      ];

      let width = 0;
      let height = 0;
      let laneWidth = 0;
      let playLeft = 0;
      let playWidth = 0;
      let hitY = 0;
      let startTime = 0;
      let score = 0;
      let combo = 0;
      let maxCombo = 0;
      let finished = false;
      let judgeTimer = 0;
      let lastCountdownText = '';
      let activeKeys = new Map();
      let particles = [];
      let laneFlashes = lanes.map(() => 0);

      const notes = generateNotes().map((note, index) => ({
        ...note,
        id: index,
        hit: false,
        missed: false
      }));

      function generateNotes() {
        const pattern = [];
        const base = [
          [0, 0], [0.5, 1], [1.0, 2], [1.5, 3],
          [2.0, 0], [2.5, 2], [3.0, 1], [3.5, 3],
          [4.0, 0], [4.0, 3], [4.5, 1], [5.0, 2], [5.5, 1],
          [6.0, 0], [6.5, 3], [7.0, 2], [7.5, 1]
        ];

        for (let block = 0; block < 3; block++) {
          for (const [beat, lane] of base) {
            pattern.push({ time: block * 8 + beat, lane: (lane + block) % 4 });
          }
        }

        const bridge = [
          [24.0, 0], [24.25, 1], [24.5, 2], [24.75, 3],
          [25.0, 3], [25.5, 1], [26.0, 0], [26.0, 2],
          [26.5, 3], [27.0, 1], [27.25, 2], [27.5, 0],
          [28.0, 0], [28.0, 3], [28.5, 1], [28.75, 2],
          [29.0, 3], [29.25, 0], [29.5, 1], [29.75, 2]
        ];
        pattern.push(...bridge.map(([time, lane]) => ({ time, lane })));

        return pattern.sort((a, b) => a.time - b.time);
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        width = rect.width;
        height = rect.height;
        playWidth = Math.min(width * 0.82, 600);
        playLeft = (width - playWidth) / 2;
        laneWidth = playWidth / 4;
        hitY = height * 0.82;
      }

      function currentSongTime(now) {
        return (now - startTime) / 1000 - countdownSeconds;
      }

      function multiplier() {
        if (combo >= 60) return 2.5;
        if (combo >= 40) return 2.0;
        if (combo >= 20) return 1.5;
        if (combo >= 10) return 1.2;
        return 1.0;
      }

      function updateHud() {
        scoreEl.textContent = String(score);
        comboEl.textContent = String(combo);
        multiplierEl.textContent = `x${multiplier().toFixed(1)} multiplier`;
      }

      function showJudge(text, color) {
        judgeEl.textContent = text;
        judgeEl.style.color = color;
        judgeEl.classList.remove('show');
        void judgeEl.offsetWidth;
        judgeEl.classList.add('show');
        judgeTimer = 0.28;
      }

      function spawnHitBurst(laneIndex, quality) {
        const lane = lanes[laneIndex];
        const centerX = playLeft + laneWidth * (laneIndex + 0.5);
        laneFlashes[laneIndex] = 1;
        const amount = quality === 'PERFECT' ? 26 : quality === 'GREAT' ? 20 : 14;

        for (let i = 0; i < amount; i++) {
          const angle = (-Math.PI / 2) + (Math.random() - 0.5) * Math.PI * 1.15;
          const speed = 120 + Math.random() * 260;
          particles.push({
            x: centerX + (Math.random() - 0.5) * laneWidth * 0.35,
            y: hitY + (Math.random() - 0.5) * 8,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.45 + Math.random() * 0.35,
            maxLife: 0.45 + Math.random() * 0.35,
            size: 3 + Math.random() * 5,
            color: lane.color
          });
        }
      }

      function hitNote(laneIndex, songTime) {
        let target = null;
        let targetDelta = Infinity;

        for (const note of notes) {
          if (note.lane !== laneIndex || note.hit || note.missed) continue;
          const delta = Math.abs(songTime - note.time);
          if (delta < targetDelta) {
            target = note;
            targetDelta = delta;
          }
        }

        if (!target || targetDelta > 0.15) {
          showJudge('MISS', '#ff3b5f');
          combo = 0;
          updateHud();
          return;
        }

        const result = hitWindows.find(window => targetDelta <= window.limit);
        target.hit = true;
        const gained = Math.round(result.points * multiplier());
        score += gained;
        combo += 1;
        maxCombo = Math.max(maxCombo, combo);
        showJudge(result.name, result.color);
        spawnHitBurst(laneIndex, result.name);
        updateHud();
      }

      function registerMiss(note) {
        note.missed = true;
        combo = 0;
        showJudge('MISS', '#ff3b5f');
        updateHud();
      }

      function roundedRect(x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      function drawBackground(songTime) {
        ctx.clearRect(0, 0, width, height);

        const pulse = 0.5 + Math.sin(songTime * Math.PI * 4) * 0.5;
        const gradient = ctx.createRadialGradient(width / 2, height * 0.25, 30, width / 2, height * 0.28, height * 0.75);
        gradient.addColorStop(0, `rgba(35, 231, 255, ${0.10 + pulse * 0.04})`);
        gradient.addColorStop(0.45, 'rgba(20, 22, 55, 0.34)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0.04)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
      }

      function drawLanes(songTime) {
        const top = height * 0.08;
        const bottom = height * 0.94;

        for (let i = 0; i < 4; i++) {
          const lane = lanes[i];
          const x = playLeft + i * laneWidth;
          const flash = laneFlashes[i];
          const keyActive = activeKeys.has(lane.key) ? 1 : 0;
          const alpha = 0.10 + flash * 0.18 + keyActive * 0.12;

          ctx.fillStyle = `${lane.glow}${alpha})`;
          ctx.fillRect(x + 4, top, laneWidth - 8, bottom - top);

          ctx.strokeStyle = `${lane.glow}${0.36 + flash * 0.42})`;
          ctx.lineWidth = 2;
          ctx.strokeRect(x + 4, top, laneWidth - 8, bottom - top);

          const centerX = x + laneWidth / 2;
          ctx.strokeStyle = `${lane.glow}${0.20 + Math.max(flash, keyActive) * 0.4})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(centerX, top);
          ctx.lineTo(centerX, bottom);
          ctx.stroke();

          ctx.font = '900 26px Inter, system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = lane.color;
          ctx.shadowColor = lane.color;
          ctx.shadowBlur = 14 + flash * 26;
          ctx.fillText(lane.label, centerX, hitY + 54);
          ctx.shadowBlur = 0;
        }

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.24)';
        ctx.lineWidth = 1;
        ctx.strokeRect(playLeft, top, playWidth, bottom - top);

        ctx.save();
        ctx.shadowBlur = 24;
        ctx.shadowColor = '#ffffff';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(playLeft - 14, hitY);
        ctx.lineTo(playLeft + playWidth + 14, hitY);
        ctx.stroke();
        ctx.restore();

        ctx.strokeStyle = `rgba(255, 255, 255, ${0.12 + Math.sin(songTime * Math.PI * 4) * 0.04})`;
        for (let y = hitY; y > height * 0.08; y -= 76) {
          ctx.beginPath();
          ctx.moveTo(playLeft, y);
          ctx.lineTo(playLeft + playWidth, y);
          ctx.stroke();
        }
      }

      function drawNotes(songTime) {
        const spawnY = -70;
        const noteH = Math.max(22, height * 0.034);
        const hitStartY = spawnY;
        const visibleDistance = hitY - hitStartY;

        for (const note of notes) {
          if (note.hit || note.missed) continue;

          const untilHit = note.time - songTime;
          const progress = 1 - untilHit / travelTime;
          const y = hitStartY + progress * visibleDistance;

          if (y > hitY + 90) {
            registerMiss(note);
            continue;
          }
          if (progress < -0.08 || y < -110) continue;

          const lane = lanes[note.lane];
          const x = playLeft + note.lane * laneWidth + laneWidth * 0.13;
          const w = laneWidth * 0.74;
          const h = noteH;

          ctx.save();
          ctx.shadowColor = lane.color;
          ctx.shadowBlur = 18;
          const grad = ctx.createLinearGradient(x, y, x + w, y + h);
          grad.addColorStop(0, lane.color);
          grad.addColorStop(0.55, '#ffffff');
          grad.addColorStop(1, lane.color);
          ctx.fillStyle = grad;
          roundedRect(x, y, w, h, 12);
          ctx.fill();

          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.78)';
          ctx.lineWidth = 1.5;
          roundedRect(x, y, w, h, 12);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawParticles(dt) {
        for (const p of particles) {
          p.life -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 520 * dt;
        }
        particles = particles.filter(p => p.life > 0);

        for (const p of particles) {
          const alpha = Math.max(0, p.life / p.maxLife);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 16;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawEndCard(songTime) {
        if (!finished || songTime < songLength + 1.8) return;
        ctx.save();
        ctx.fillStyle = 'rgba(2, 3, 10, 0.72)';
        ctx.fillRect(0, 0, width, height);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#23e7ff';
        ctx.shadowBlur = 28;
        ctx.font = '1000 54px Inter, system-ui, sans-serif';
        ctx.fillText('TRACK CLEAR', width / 2, height * 0.42);
        ctx.shadowBlur = 0;
        ctx.font = '800 24px Inter, system-ui, sans-serif';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.82)';
        ctx.fillText(`Score ${score}  •  Max Combo ${maxCombo}`, width / 2, height * 0.51);
        ctx.font = '700 16px Inter, system-ui, sans-serif';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.fillText('Refresh to play again', width / 2, height * 0.58);
        ctx.restore();
      }

      let previousNow = performance.now();
      function frame(now) {
        const dt = Math.min(0.033, (now - previousNow) / 1000);
        previousNow = now;
        const songTime = currentSongTime(now);

        for (let i = 0; i < laneFlashes.length; i++) {
          laneFlashes[i] = Math.max(0, laneFlashes[i] - dt * 4.8);
        }

        for (const [key, value] of activeKeys) {
          if (now - value > 115) activeKeys.delete(key);
        }

        if (judgeTimer > 0) {
          judgeTimer -= dt;
          if (judgeTimer <= 0) judgeEl.classList.remove('show');
        }

        updateCountdown(songTime);
        drawBackground(songTime);
        drawLanes(songTime);
        drawNotes(songTime);
        drawParticles(dt);

        if (!finished && songTime > songLength + 1.1) {
          finished = true;
        }
        drawEndCard(songTime);

        requestAnimationFrame(frame);
      }

      function updateCountdown(songTime) {
        if (songTime >= 0) {
          countdownEl.style.opacity = '0';
          return;
        }
        const remaining = Math.ceil(Math.abs(songTime));
        const text = remaining > 0 ? String(remaining) : 'GO';
        if (text !== lastCountdownText) {
          countdownEl.textContent = text;
          countdownEl.animate([
            { opacity: 0, transform: 'scale(0.75)' },
            { opacity: 1, transform: 'scale(1)' },
            { opacity: 0, transform: 'scale(1.22)' }
          ], { duration: 760, easing: 'cubic-bezier(.2,.7,.2,1)' });
          lastCountdownText = text;
        }
      }

      window.addEventListener('keydown', event => {
        const key = event.key.toLowerCase();
        if (!(key in keyToLane) || event.repeat) return;
        event.preventDefault();
        activeKeys.set(key, performance.now());
        hitNote(keyToLane[key], currentSongTime(performance.now()));
      });

      // Touch support
      const touchLanes = document.querySelectorAll('.touchLane');
      let touchActiveLanes = new Set();

      function getTouchLane(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const relX = clientX - rect.left;
        const relY = clientY - rect.top;
        // Map touch position to lane
        const lx = relX - playLeft;
        const laneIdx = Math.floor(lx / laneWidth);
        if (laneIdx >= 0 && laneIdx < 4 && relY > height * 0.35) {
          return laneIdx;
        }
        return -1;
      }

      function handleTouchStart(evt) {
        evt.preventDefault();
        for (const touch of evt.changedTouches) {
          const laneIdx = getTouchLane(touch.clientX, touch.clientY);
          if (laneIdx >= 0 && !touchActiveLanes.has(laneIdx)) {
            touchActiveLanes.add(laneIdx);
            touchLanes[laneIdx].classList.add('active');
            hitNote(laneIdx, currentSongTime(performance.now()));
          }
        }
      }

      function handleTouchEnd(evt) {
        evt.preventDefault();
        for (const touch of evt.changedTouches) {
          const laneIdx = getTouchLane(touch.clientX, touch.clientY);
          touchActiveLanes.delete(laneIdx);
          if (laneIdx >= 0) {
            touchLanes[laneIdx].classList.remove('active');
          }
        }
      }

      function handleTouchMove(evt) {
        evt.preventDefault();
        const newActive = new Set();
        for (const touch of evt.changedTouches) {
          const laneIdx = getTouchLane(touch.clientX, touch.clientY);
          if (laneIdx >= 0) {
            newActive.add(laneIdx);
            if (!touchActiveLanes.has(laneIdx)) {
              touchActiveLanes.add(laneIdx);
              touchLanes[laneIdx].classList.add('active');
              hitNote(laneIdx, currentSongTime(performance.now()));
            }
          }
        }
        // Clear lanes no longer touched
        for (const idx of touchActiveLanes) {
          if (!newActive.has(idx)) {
            touchLanes[idx].classList.remove('active');
          }
        }
        touchActiveLanes = newActive;
      }

      canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
      canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
      canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });
      canvas.addEventListener('touchmove', handleTouchMove, { passive: false });

      window.addEventListener('resize', resize);
      resize();
      updateHud();

      setTimeout(() => overlayEl.classList.add('fade'), 1700);
      setTimeout(() => overlayEl.remove(), 2800);

      startTime = performance.now();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
